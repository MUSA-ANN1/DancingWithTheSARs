name: NISAR Caspian processing

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nisar-caspian-processing
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EDL_TOKEN: ${{ secrets.EDL_TOKEN }}
      GITHUB_REPO: MUSA-ANN1/DancingWithTheSARs
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUT_DIR: ${{ github.workspace }}/out
      TMP_DIR: ${{ github.workspace }}/nisar-tmp
      STATE_FILE: ${{ github.workspace }}/nisar-state.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore previously published NISAR products
        uses: actions/checkout@v4
        with:
          ref: data
          path: previous-data
          persist-credentials: false

      - name: Check available disk space
        run: |
          df -h
          mkdir -p "$OUT_DIR" "$TMP_DIR"
          df -h "$OUT_DIR" "$TMP_DIR"
          if [ -d previous-data/regions ]; then cp -a previous-data/regions "$OUT_DIR/"; fi
          for file in index.json level.json; do
            if [ -f "previous-data/$file" ]; then cp -a "previous-data/$file" "$OUT_DIR/"; fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r server/requirements.txt

      - name: Check EDL token is configured
        run: |
          if [ -z "$EDL_TOKEN" ]; then
            echo "::error::Add EDL_TOKEN in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Validate NISAR processing helpers
        run: python -m unittest discover -s server -p 'test_*.py' -v

      - name: Process NISAR data
        run: python server/run_job.py

      - name: Publish compact outputs to data branch
        if: success()
        run: bash server/publish.sh
